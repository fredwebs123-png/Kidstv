<html lang="en">
<head>
<meta charset="utf-8">
<title>Kidstv grown-ups PIN</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#efe6ff}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #ffffff; background: linear-gradient(180deg, #2a1a66 0%, #6a43c2 45%, #c07ab8 70%, #3a1e6e 100%);">

  <svg width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs>
      <filter id="kblur"><feGaussianBlur stdDeviation="40"></feGaussianBlur></filter>
      <filter id="kgrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    </defs>
    <g filter="url(#kblur)" opacity="0.9">
      <circle cx="1430" cy="560" r="180" fill="#ffe3c0"></circle>
      <path d="M0 668 C 260 612, 520 642, 770 684 S 1190 726, 1450 672 S 1780 628, 1920 652 L1920 1080 L0 1080 Z" fill="#6a3fb8"></path>

      <rect x="112" y="120" width="560" height="260" rx="40" fill="#ffffff" opacity="0.5"></rect>
      <rect x="112" y="900" width="1200" height="150" rx="40" fill="#ff6a8a" opacity="0.5"></rect>
    </g>
    <rect width="1920" height="1080" fill="#120830" opacity="0.5"></rect>
    <rect width="1920" height="1080" filter="url(#kgrain)" opacity="0.06"></rect>
  </svg>

  <div style="position: absolute; left: 50%; top: 50%; width: 620px; margin-left: -310px; margin-top: -440px; box-sizing: border-box; padding: 64px 72px 72px; border-radius: 64px; background: rgba(36, 22, 80, 0.72); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 40px 120px rgba(8, 2, 30, 0.6); display: flex; flex-direction: column; align-items: center; gap: 40px;">
    <div style="width: 96px; height: 96px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: center;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 56px; line-height: 1;">Grown-ups only</h1>
      <p style="margin: 0; font-size: 26px; font-weight: 700; color: rgba(236, 226, 255, 0.75);">Type the PIN with the remote's numbers</p>
    </div>
    <div style="display: flex; gap: 26px;">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #ffffff;"></span>
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #ffffff;"></span>
      <span style="width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.6);"></span>
      <span style="width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.6);"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; width: 100%;">
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">1</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">2</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">3</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">4</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: #ffffff; color: #2a1a66; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px; transform: scale(1.08); box-shadow: 0 0 0 6px #8e5cff, 0 16px 40px rgba(8, 2, 30, 0.5);">5</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">6</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">7</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">8</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">9</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.85); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 26px;">Cancel</button>
      <button type="button" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.12); color: #ffffff; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 48px;">0</button>
      <button type="button" aria-label="Delete" style="height: 112px; border: 0; border-radius: 56px; background: rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: center;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M17 9l-5 6M12 9l5 6"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

</html>
