    <div style="display: flex; align-items: flex-start; gap: 120px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px;">

          <svg width="280" height="280" viewBox="0 0 100 100" role="img" aria-label="Blake, butterfly">

        </div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 56px; margin-top: 14px;">Blake</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px; opacity: 0.82;">
        <div style="width: 300px; height: 300px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.35), 0 24px 60px rgba(20, 8, 60, 0.45);">
          <svg width="300" height="300" viewBox="0 0 100 100" role="img" aria-label="Lucy, rainbow">
            <defs><linearGradient id="plA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9fd0"></stop><stop offset="1" stop-color="#ff4f9a"></stop></linearGradient></defs>

            <path d="M38 66 A12 12 0 0 1 62 66" stroke="#8fe3ff" stroke-width="8" fill="none" stroke-linecap="round"></path>
            <circle cx="20" cy="70" r="8" fill="#ffffff"></circle><circle cx="28" cy="72" r="6" fill="#ffffff"></circle>
            <circle cx="80" cy="70" r="8" fill="#ffffff"></circle><circle cx="72" cy="72" r="6" fill="#ffffff"></circle>
          </svg>
        </div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 50px; margin-top: 14px;">Lucy</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px; opacity: 0.82;">
        <div style="width: 300px; height: 300px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.35), 0 24px 60px rgba(20, 8, 60, 0.45);">
          <svg width="300" height="300" viewBox="0 0 100 100" role="img" aria-label="Sora, little chick">
            <defs><linearGradient id="psA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe6d4"></stop><stop offset="1" stop-color="#16a69a"></stop></linearGradient></defs>
            <circle cx="50" cy="50" r="50" fill="url(#psA)"></circle>
            <circle cx="50" cy="44" r="20" fill="#ffd84d"></circle>
            <circle cx="44" cy="41" r="3" fill="#3a2a10"></circle><circle cx="57" cy="41" r="3" fill="#3a2a10"></circle>
            <path d="M47 48 L53 48 L50 53 Z" fill="#ff8a3d"></path>
            <path d="M26 58 L34 52 L42 60 L50 52 L58 60 L66 52 L74 58 L72 78 C 66 88, 34 88, 28 78 Z" fill="#ffffff"></path>
          </svg>
        </div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 50px; margin-top: 14px;">Sora</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
