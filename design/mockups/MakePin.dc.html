    <h1 style="margin: 0; font-size: 88px; line-height: 1; font-weight: 300; letter-spacing: -0.035em;">Make a grown-ups PIN</h1>
    <p style="margin: 0; font-size: 32px; line-height: 1.45; font-weight: 500; color: rgba(238, 241, 247, 0.7);">Four numbers the girls don't know. You'll need it for More apps, Controls and extra time at bedtime.</p>
    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 18px; font-size: 24px; font-weight: 600; color: rgba(238, 241, 247, 0.6);">
      <span style="display: flex; align-items: center; gap: 14px;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#34c77b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Kept on this TV only</span>
      <span style="display: flex; align-items: center; gap: 14px;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#34c77b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Change it any time from Controls</span>
    </div>
  </div>

  <div style="position: absolute; right: 200px; top: 50%; width: 560px; margin-top: -400px; box-sizing: border-box; padding: 56px 64px 64px; border-radius: 56px; background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 40px 120px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; align-items: center; gap: 44px;">
    <div style="display: flex; gap: 26px;">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #ffffff;"></span>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #ffffff;"></span>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #ffffff;"></span>
      <span style="width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.55);"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%;">
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">1</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">2</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">3</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">4</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">5</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">6</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">7</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: #ffffff; color: #0b0d12; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 44px; transform: scale(1.08); box-shadow: 0 0 0 4px {{accent}}, 0 16px 40px rgba(0, 0, 0, 0.5);">8</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">9</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: transparent; color: rgba(238, 241, 247, 0.75); font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 24px;">Cancel</button>
      <button type="button" style="height: 104px; border: 0; border-radius: 52px; background: rgba(255, 255, 255, 0.08); color: #eef1f7; font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 44px;">0</button>
      <button type="button" aria-label="Delete" style="height: 104px; border: 0; border-radius: 52px; background: transparent; display: flex; align-items: center; justify-content: center;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#eef1f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M17 9l-5 6M12 9l5 6"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8e5cff","options":["#8e5cff","#ff5fa8","#2fc4b2"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8e5cff' };
  }
}
</script>
</body>
