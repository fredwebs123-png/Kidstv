<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3b2685"></stop>
        <stop offset="0.38" stop-color="#8a5ae0"></stop>
        <stop offset="0.62" stop-color="#e9a0d6"></stop>
        <stop offset="0.8" stop-color="#ffd2c2"></stop>
      </linearGradient>
      <radialGradient id="sun" cx="1500" cy="580" r="520" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff4d6" stop-opacity="1"></stop>
        <stop offset="0.12" stop-color="#ffe0b8" stop-opacity="0.95"></stop>
        <stop offset="0.45" stop-color="#ffb8c8" stop-opacity="0.35"></stop>
        <stop offset="1" stop-color="#ffb8c8" stop-opacity="0"></stop>
      </radialGradient>
      <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79be8"></stop><stop offset="1" stop-color="#a77ad8"></stop></linearGradient>
      <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cd0"></stop><stop offset="1" stop-color="#5e3aa8"></stop></linearGradient>
      <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a8e"></stop><stop offset="1" stop-color="#22134f"></stop></linearGradient>
      <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe4ef" stop-opacity="0"></stop><stop offset="0.5" stop-color="#ffe4ef" stop-opacity="0.45"></stop><stop offset="1" stop-color="#ffe4ef" stop-opacity="0"></stop></linearGradient>
      <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140a33" stop-opacity="0"></stop><stop offset="1" stop-color="#140a33" stop-opacity="0.7"></stop></linearGradient>
      <linearGradient id="topscrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0f45" stop-opacity="0.5"></stop><stop offset="1" stop-color="#1b0f45" stop-opacity="0"></stop></linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
